    <meta property="og:url" content="https://healiix.vercel.app">
    <meta property="twitter:image" content="./assets/images/icon.png">

    <title>Notifications | Doctor Panel | HealiiX</title>
    <link rel="icon" href="./assets/images/icon.png" type="image/png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f3f7f5] text-[#123b39] min-h-screen antialiased">
    <div class="flex min-h-screen">
        <aside id="dashboard-sidebar"></aside>
        <div class="flex-1 flex flex-col min-w-0">
            <header id="dashboard-header"></header>
            <main class="p-6 sm:p-8 flex-1 max-w-4xl w-full mx-auto space-y-6">
                <div class="bg-white rounded-2xl border border-[#e1eae6] shadow-sm p-6 sm:p-8">
                    <h2 class="font-extrabold text-lg text-[#082c2a] mb-1">Clinical Broadcasts &amp; Notices</h2>
                    <p class="text-xs text-[#6c8680] mb-6">Visible only after signing in. Notices remain active until their scheduled limit expires or you dismiss them.</p>
                    <div id="doc-notif-list" class="space-y-3"></div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { initDashboardShell, renderActiveNotifications } from './js/dashboard-layout.js';

        (async () => {
            const user = await initDashboardShell('doctor', 'doctor-notifications.html', 'Notifications', 'Platform announcements and practitioner notices');
            if (!user) return;
            const el = document.getElementById('doc-notif-list');
            await renderActiveNotifications(el);
            if (!el.innerHTML.trim()) {
                el.innerHTML = `<p class="text-xs text-[#6c8680] py-6 text-center">You are all caught up — no active announcements right now.</p>`;
            }
        })();
    </script>
</body>
