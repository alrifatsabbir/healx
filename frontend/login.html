<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your HealiiX account to manage appointments and access healthcare records.">
    <title>Sign In | HealiiX Healthcare Platform</title>
    <link rel="icon" href="./assets/images/icon.png" type="image/png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8f8f4] text-[#123b39] min-h-screen flex flex-col justify-between antialiased">
    
    <!-- Top bar -->
    <div class="p-6">
        <div class="container w-[min(1180px,calc(100%-48px))] mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <img src="./assets/images/healx-logo-bg-black.png" alt="HealiiX" width="130" height="35" class="h-10 w-auto object-contain">
            </a>
            <a href="index.html" class="text-xs sm:text-sm font-semibold text-[#082c2a] hover:text-[#0e927f] transition-colors flex items-center gap-1.5">
                ← Back to home
            </a>
        </div>
    </div>

    <!-- Login Card -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 my-4">
        <div class="w-full max-w-[480px] bg-white rounded-3xl p-8 sm:p-10 border border-[#e1eae6] shadow-[0_12px_40px_rgba(8,44,42,0.08)]">
            
            <!-- Role Toggle -->
            <div class="flex bg-[#edf5f1] p-1.5 rounded-2xl mb-8">
                <button type="button" id="tab-patient" class="flex-1 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white text-[#082c2a] shadow-sm transition-all cursor-pointer">
                    Patient Login
                </button>
                <button type="button" id="tab-doctor" class="flex-1 py-2 rounded-xl text-xs sm:text-sm font-bold text-[#627a74] hover:text-[#082c2a] transition-all cursor-pointer">
                    Doctor Login
                </button>
            </div>

            <div class="mb-6">
                <h1 id="login-title" class="font-extrabold text-2xl sm:text-3xl text-[#082c2a] tracking-tight mb-2">Welcome Back</h1>
                <p id="login-subtitle" class="text-xs sm:text-sm text-[#6c8680]">Enter your email or username to access your HealiiX account.</p>
            </div>

            <!-- Feedback Notice -->
            <div id="login-feedback" class="mb-4 p-3.5 rounded-xl text-xs font-semibold hidden"></div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-[#082c2a] mb-1.5">Email or Username *</label>
                    <input type="text" id="login-identifier" required placeholder="name@example.com or @username" autocomplete="username" class="w-full px-4 py-3 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm text-[#082c2a] focus:bg-white focus:border-[#0e927f] focus:ring-2 focus:ring-[#0e927f]/20 outline-none transition-all">
                </div>

                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <label class="block text-xs font-bold text-[#082c2a]">Password *</label>
                        <button type="button" id="forgot-pwd-trigger" class="text-xs text-[#0e927f] font-semibold hover:underline bg-transparent border-0 p-0 cursor-pointer">Forgot password?</button>
                    </div>
                    <div class="relative">
                        <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password" class="w-full px-4 py-3 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm text-[#082c2a] focus:bg-white focus:border-[#0e927f] focus:ring-2 focus:ring-[#0e927f]/20 outline-none transition-all">
                        <button type="button" id="toggle-pwd-btn" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-[#738a83] hover:text-[#082c2a] cursor-pointer">Show</button>
                    </div>
                </div>

                <div class="flex items-center gap-2 pt-1">
                    <input type="checkbox" id="remember-me" class="rounded text-[#0e927f] focus:ring-[#0e927f] cursor-pointer">
                    <label for="remember-me" class="text-xs text-[#526a64] cursor-pointer select-none">Remember this device</label>
                </div>

                <button type="submit" id="submit-btn" class="w-full py-3.5 px-6 rounded-full font-bold text-sm bg-[#0e927f] text-white hover:bg-[#087866] transition-all cursor-pointer shadow-md flex items-center justify-center gap-2 mt-4 disabled:opacity-60 disabled:cursor-not-allowed">
                    <span id="btn-text">Sign In</span> <span id="btn-arrow">↗</span>
                </button>
            </form>

            <!-- Forgot Password / Reset OTP Panel -->
            <div id="forgot-panel" class="hidden space-y-4">
                <div id="forgot-step1">
                    <label class="block text-xs font-bold text-[#082c2a] mb-1.5">Registered Email or Username *</label>
                    <input type="text" id="forgot-identifier" placeholder="name@example.com or @username" class="w-full px-4 py-3 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm text-[#082c2a] focus:bg-white focus:border-[#0e927f] outline-none">
                    <button type="button" id="forgot-send-btn" class="w-full mt-4 py-3.5 px-6 rounded-full font-bold text-sm bg-[#0e927f] text-white hover:bg-[#087866] transition-all cursor-pointer shadow-md">
                        Send Reset OTP ↗
                    </button>
                </div>

                <div id="forgot-step2" class="hidden space-y-3">
                    <div>
                        <label class="block text-xs font-bold text-[#082c2a] mb-1.5">6-Digit OTP *</label>
                        <input type="text" id="reset-otp" maxlength="6" placeholder="123456" class="w-full px-4 py-3 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-center font-mono text-lg font-bold tracking-widest text-[#082c2a] outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#082c2a] mb-1.5">New Password *</label>
                        <input type="password" id="reset-new-pwd" placeholder="Min 6 characters" class="w-full px-4 py-3 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm text-[#082c2a] outline-none">
                    </div>
                    <button type="button" id="reset-confirm-btn" class="w-full py-3.5 px-6 rounded-full font-bold text-sm bg-[#0e927f] text-white hover:bg-[#087866] transition-all cursor-pointer shadow-md">
                        Update Password & Sign In ↗
                    </button>
                </div>

                <button type="button" id="back-to-login-btn" class="w-full text-center text-xs font-semibold text-[#556e68] hover:text-[#082c2a] pt-2 cursor-pointer bg-transparent border-0">
                    ← Back to Sign In
                </button>
            </div>

            <div class="mt-8 pt-6 border-t border-[#edf2ef] text-center text-xs sm:text-sm text-[#6c8680]">
                Don't have an account yet? 
                <a href="sign-up.html" class="font-bold text-[#0e927f] hover:underline">Create an account</a>
            </div>
        </div>
    </main>

    <!-- Bottom note -->
    <footer class="p-6 text-center text-xs text-[#7d948f]">
        © 2026 HealiiX Healthcare Platform • Secure 256-bit SSL encrypted
    </footer>

    <!-- Real API Integration -->
    <script type="module">
        import api from './js/api.js';

        let currentRole = 'patient';
        const tabPatient = document.getElementById('tab-patient');
        const tabDoctor = document.getElementById('tab-doctor');
        const loginTitle = document.getElementById('login-title');
        const loginSubtitle = document.getElementById('login-subtitle');
        const pwdInput = document.getElementById('login-password');
        const toggleBtn = document.getElementById('toggle-pwd-btn');
        const form = document.getElementById('login-form');
        const feedback = document.getElementById('login-feedback');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const identifierInput = document.getElementById('login-identifier');

        tabPatient.addEventListener('click', () => {
            currentRole = 'patient';
            tabPatient.classList.add('bg-white', 'text-[#082c2a]', 'shadow-sm');
            tabPatient.classList.remove('text-[#627a74]');
            tabDoctor.classList.remove('bg-white', 'text-[#082c2a]', 'shadow-sm');
            tabDoctor.classList.add('text-[#627a74]');
            loginTitle.textContent = 'Welcome Back';
            loginSubtitle.textContent = 'Enter your email or username to access your patient appointments.';
            identifierInput.placeholder = 'name@example.com or @username';
        });

        tabDoctor.addEventListener('click', () => {
            currentRole = 'doctor';
            tabDoctor.classList.add('bg-white', 'text-[#082c2a]', 'shadow-sm');
            tabDoctor.classList.remove('text-[#627a74]');
            tabPatient.classList.remove('bg-white', 'text-[#082c2a]', 'shadow-sm');
            tabPatient.classList.add('text-[#627a74]');
            loginTitle.textContent = 'Doctor Portal Login';
            loginSubtitle.textContent = 'Sign in to access consultation chamber schedules and patient notes.';
            identifierInput.placeholder = 'doctor@healiix.health or @doctor_username';
        });

        toggleBtn.addEventListener('click', () => {
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                toggleBtn.textContent = 'Hide';
            } else {
                pwdInput.type = 'password';
                toggleBtn.textContent = 'Show';
            }
        });

        function showFeedback(msg, isError = false) {
            feedback.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-[#eef8f5]', 'text-[#0e927f]', 'border-[#c8e6dc]');
            feedback.classList.add('border');
            if (isError) {
                feedback.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
            } else {
                feedback.classList.add('bg-[#eef8f5]', 'text-[#0e927f]', 'border-[#c8e6dc]');
            }
            feedback.textContent = msg;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const identifier = identifierInput.value.trim();
            const password = pwdInput.value;

            if (!identifier || !password) {
                showFeedback('Please provide both your Email/Username and Password.', true);
                return;
            }

            try {
                submitBtn.disabled = true;
                btnText.textContent = 'Verifying credentials...';

                const res = await api.login(identifier, password);

                showFeedback(`✓ Welcome back, ${res.user.fullName || res.user.username}! Redirecting...`, false);

                setTimeout(() => {
                    if (res.user.role === 'doctor' && res.user.profileUrl) {
                        window.location.href = res.user.profileUrl;
                    } else if (res.user.role === 'admin') {
                        window.location.href = 'index.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                }, 800);
            } catch (err) {
                showFeedback(err.message || 'Login failed. Please check your credentials.', true);
            } finally {
                submitBtn.disabled = false;
                btnText.textContent = 'Sign In';
            }
        });

        // Forgot Password Flow
        const forgotTrigger = document.getElementById('forgot-pwd-trigger');
        const forgotPanel = document.getElementById('forgot-panel');
        const forgotStep1 = document.getElementById('forgot-step1');
        const forgotStep2 = document.getElementById('forgot-step2');
        const forgotSendBtn = document.getElementById('forgot-send-btn');
        const resetConfirmBtn = document.getElementById('reset-confirm-btn');
        const backToLoginBtn = document.getElementById('back-to-login-btn');
        let resetTargetEmail = '';

        forgotTrigger?.addEventListener('click', () => {
            form.classList.add('hidden');
            forgotPanel.classList.remove('hidden');
            forgotStep1.classList.remove('hidden');
            forgotStep2.classList.add('hidden');
            loginTitle.textContent = 'Reset Password';
            loginSubtitle.textContent = 'Enter your email or username to receive a 6-digit recovery OTP.';
            feedback.classList.add('hidden');
        });

        backToLoginBtn?.addEventListener('click', () => {
            forgotPanel.classList.add('hidden');
            form.classList.remove('hidden');
            loginTitle.textContent = currentRole === 'doctor' ? 'Doctor Portal Login' : 'Welcome Back';
            loginSubtitle.textContent = 'Enter your email or username to access your HealiiX account.';
            feedback.classList.add('hidden');
        });

        forgotSendBtn?.addEventListener('click', async () => {
            const identifier = document.getElementById('forgot-identifier').value.trim();
            if (!identifier) {
                showFeedback('Please enter your registered email or username.', true);
                return;
            }
            try {
                forgotSendBtn.disabled = true;
                forgotSendBtn.textContent = 'Sending OTP...';
                const res = await api.forgotPassword(identifier);
                resetTargetEmail = res.email;
                showFeedback(`✓ ${res.message}`, false);
                forgotStep1.classList.add('hidden');
                forgotStep2.classList.remove('hidden');
            } catch (err) {
                showFeedback(err.message || 'Could not send reset OTP.', true);
            } finally {
                forgotSendBtn.disabled = false;
                forgotSendBtn.textContent = 'Send Reset OTP ↗';
            }
        });

        resetConfirmBtn?.addEventListener('click', async () => {
            const otp = document.getElementById('reset-otp').value.trim();
            const newPassword = document.getElementById('reset-new-pwd').value;
            if (!otp || !newPassword) {
                showFeedback('Please enter both the 6-digit OTP and your new password.', true);
                return;
            }
            try {
                resetConfirmBtn.disabled = true;
                resetConfirmBtn.textContent = 'Updating password...';
                const res = await api.resetPassword({ email: resetTargetEmail, otp, newPassword });
                showFeedback(`✓ ${res.message}`, false);
                setTimeout(() => {
                    backToLoginBtn.click();
                }, 1200);
            } catch (err) {
                showFeedback(err.message || 'Failed to reset password.', true);
            } finally {
                resetConfirmBtn.disabled = false;
                resetConfirmBtn.textContent = 'Update Password & Sign In ↗';
            }
        });
    </script>
</body>
</html>
