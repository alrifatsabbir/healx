<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="keywords" content="HealiiX, HealiiX website, healix, healix website, HealiiX find care, HealiiX find doctor, HealiiX book appointment">
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8">
    <meta name="author" content="HealiiX, alrifatsabbir">
    <meta property="og:image" content="./assets/images/icon.png">
    <meta property="og:site_name" content="https://healiix.vercel.app">
    <meta property="og:title" content="HealiiX | Find Care That Fits Your Life">
    <meta property="og:description" content="Find the right doctor for you with HealiiX, an online doctor directory and appointment booking platform built around better" />
    <meta property="og:url" content="https://healiix.vercel.app">
    <meta property="twitter:image" content="./assets/images/icon.png">
    <meta name="twitter:card" content="Find the right doctor for you with HealiiX, an online doctor directory and appointment booking platform built around better">
    <meta name="twitter:site" content="@alrifatsabbir">
    <meta name="twitter:title" content="HealiiX | Find Care That Fits Your Life">
    <meta name="twitter:description" content="Find the right doctor for you with HealiiX, an online doctor directory and appointment booking platform built around better">
    <title>Chambers &amp; Fees | Doctor Panel | HealiiX</title>
    <link rel="icon" href="./assets/images/icon.png" type="image/png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f3f7f5] text-[#123b39] min-h-screen antialiased">
    <div class="flex min-h-screen">
        <aside id="dashboard-sidebar"></aside>
        <div class="flex-1 flex flex-col min-w-0">
            <header id="dashboard-header"></header>
            <main class="p-6 sm:p-8 flex-1 max-w-5xl w-full mx-auto space-y-6">
                <div id="page-alert" class="hidden p-4 rounded-xl text-xs font-semibold border"></div>

                <!-- Header Bar -->
                <div class="bg-white rounded-2xl border border-[#e1eae6] shadow-sm p-6 flex flex-wrap items-center justify-between gap-4">
                    <div>
                        <h2 class="font-extrabold text-lg text-[#082c2a]">Practice Chambers &amp; Visiting Hours</h2>
                        <p class="text-xs text-[#6c8680]">Configure consultation fees, hospital locations, visiting days, and patient booking time slots</p>
                    </div>
                    <button type="button" id="open-chamber-modal" class="px-5 py-2.5 rounded-full bg-[#0e927f] hover:bg-[#087866] text-white font-bold text-xs cursor-pointer">+ Add Chamber</button>
                </div>

                <!-- Chambers List -->
                <div id="chambers-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
            </main>
        </div>
    </div>

    <!-- Add / Edit Chamber Modal -->
    <div id="chamber-modal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 sm:p-8 shadow-2xl border border-[#e1eae6] max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h3 id="cm-title" class="font-extrabold text-xl text-[#082c2a]">Add Chamber</h3>
                <button type="button" id="close-chamber-modal" class="text-xs font-bold text-[#6c8680] hover:text-[#082c2a] cursor-pointer">Close</button>
            </div>
            <form id="chamber-form" class="space-y-4">
                <input type="hidden" id="cm-index" value="-1">
                <div>
                    <label class="block text-xs font-bold text-[#082c2a] mb-1">Hospital / Clinic Name *</label>
                    <input type="text" id="cm-hospital" required placeholder="e.g. Popular Diagnostic Centre, Dhanmondi" class="w-full px-4 py-2.5 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm outline-none focus:border-[#0e927f]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#082c2a] mb-1">Street Address *</label>
                    <input type="text" id="cm-address" required placeholder="House 16, Road 2, Dhanmondi" class="w-full px-4 py-2.5 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm outline-none focus:border-[#0e927f]">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-[#082c2a] mb-1">City *</label>
                        <input type="text" id="cm-city" required value="Dhaka" class="w-full px-3.5 py-2.5 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm outline-none focus:border-[#0e927f]">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#082c2a] mb-1">District *</label>
                        <input type="text" id="cm-district" required value="Dhaka" class="w-full px-3.5 py-2.5 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm outline-none focus:border-[#0e927f]">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#082c2a] mb-1">Fee (BDT) *</label>
                        <input type="number" id="cm-fee" required min="0" value="1000" class="w-full px-3.5 py-2.5 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm outline-none focus:border-[#0e927f]">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#082c2a] mb-1.5">Visiting Days *</label>
                    <div id="cm-days-wrap" class="grid grid-cols-4 sm:grid-cols-7 gap-2 text-xs">
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" value="Saturday" class="cm-day accent-[#0e927f]"> Sat</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" value="Sunday" class="cm-day accent-[#0e927f]"> Sun</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" value="Monday" class="cm-day accent-[#0e927f]"> Mon</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" value="Tuesday" class="cm-day accent-[#0e927f]"> Tue</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" value="Wednesday" class="cm-day accent-[#0e927f]"> Wed</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" value="Thursday" class="cm-day accent-[#0e927f]"> Thu</label>
                        <label class="flex items-center gap-1.5 cursor-pointer"><input type="checkbox" value="Friday" class="cm-day accent-[#0e927f]"> Fri</label>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#082c2a] mb-1">Visiting Hours Display</label>
                    <input type="text" id="cm-hours" placeholder="e.g. 5:00 PM - 9:00 PM" class="w-full px-4 py-2.5 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm outline-none focus:border-[#0e927f]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-[#082c2a] mb-1">Bookable Time Slots (comma separated) *</label>
                    <input type="text" id="cm-slots" required value="05:00 PM, 05:30 PM, 06:00 PM, 07:00 PM, 08:00 PM" class="w-full px-4 py-2.5 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm outline-none focus:border-[#0e927f]">
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" id="cancel-chamber-btn" class="px-4 py-2 rounded-full text-xs font-bold text-[#556e68] hover:bg-[#edf5f1] cursor-pointer">Cancel</button>
                    <button type="submit" id="save-chamber-btn" class="px-5 py-2.5 rounded-full text-xs font-bold bg-[#0e927f] text-white hover:bg-[#087866] cursor-pointer">Save Chamber</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import api from './js/api.js';
        import { initDashboardShell } from './js/dashboard-layout.js';

        let chambers = [];
        const modal = document.getElementById('chamber-modal');
        const alertEl = document.getElementById('page-alert');

        function showAlert(msg, isError = false) {
            alertEl.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-[#eef8f5]', 'text-[#0e927f]', 'border-[#c8e6dc]');
            alertEl.classList.add(...(isError ? ['bg-red-50', 'text-red-700', 'border-red-200'] : ['bg-[#eef8f5]', 'text-[#0e927f]', 'border-[#c8e6dc]']));
            alertEl.textContent = msg;
            setTimeout(() => alertEl.classList.add('hidden'), 5000);
        }

        function renderChambers() {
            const grid = document.getElementById('chambers-grid');
            if (chambers.length === 0) {
                grid.innerHTML = `<div class="col-span-full bg-white rounded-2xl border border-[#e1eae6] p-10 text-center text-xs text-[#6c8680]">No practice chambers added yet. Click "+ Add Chamber" to publish your visiting locations and fees.</div>`;
                return;
            }
            grid.innerHTML = chambers.map((c, idx) => `
                <div class="bg-white rounded-2xl border border-[#e1eae6] shadow-sm p-6 flex flex-col justify-between gap-4">
                    <div>
                        <div class="flex items-start justify-between gap-3 mb-2">
                            <h3 class="font-extrabold text-base text-[#082c2a]">${c.hospitalName}</h3>
                            <span class="font-extrabold text-sm text-[#0e927f] shrink-0">BDT ${c.fee}</span>
                        </div>
                        <p class="text-xs text-[#556e68] mb-2">${c.address}, ${c.city} (${c.district})</p>
                        <p class="text-xs text-[#082c2a] font-semibold mb-1">Days: ${(c.visitingDays || []).join(', ') || 'Not specified'}</p>
                        <p class="text-xs text-[#6c8680]">Hours: ${c.visitingHours || 'Flexible'} • ${(c.slots || []).length} booking slot(s)</p>
                    </div>
                    <div class="flex items-center justify-end gap-2 pt-3 border-t border-[#edf3f0]">
                        <button type="button" data-edit="${idx}" class="px-3.5 py-1.5 rounded-full bg-[#edf7f4] text-[#087866] text-xs font-bold hover:bg-[#daf1e8] cursor-pointer">Edit</button>
                        <button type="button" data-del="${idx}" class="px-3.5 py-1.5 rounded-full bg-red-50 text-red-600 text-xs font-bold hover:bg-red-100 cursor-pointer">Remove</button>
                    </div>
                </div>
            `).join('');

            grid.querySelectorAll('[data-edit]').forEach(btn => {
                btn.onclick = () => openModal(Number(btn.dataset.edit));
            });
            grid.querySelectorAll('[data-del]').forEach(btn => {
                btn.onclick = async () => {
                    const idx = Number(btn.dataset.del);
                    const chamberName = chambers[idx]?.hospitalName || 'this chamber';
                    if (window.healiixConfirm) {
                        const ok = await window.healiixConfirm({
                            title: 'Remove Chamber?',
                            message: `Are you sure you want to remove "${chamberName}" from your active practice chambers?`,
                            confirmText: 'Remove Chamber',
                            type: 'danger'
                        });
                        if (!ok) return;
                    } else if (!confirm(`Remove "${chamberName}" from your chambers?`)) {
                        return;
                    }
                    const updated = chambers.filter((_, i) => i !== idx);
                    await persistChambers(updated, 'Chamber removed.');
                };
            });
        }

        function openModal(idx = -1) {
            document.getElementById('cm-index').value = idx;
            document.getElementById('cm-title').textContent = idx >= 0 ? 'Edit Chamber' : 'Add Chamber';
            const c = idx >= 0 ? chambers[idx] : null;
            document.getElementById('cm-hospital').value = c?.hospitalName || '';
            document.getElementById('cm-address').value = c?.address || '';
            document.getElementById('cm-city').value = c?.city || 'Dhaka';
            document.getElementById('cm-district').value = c?.district || 'Dhaka';
            document.getElementById('cm-fee').value = c?.fee ?? 1000;
            document.getElementById('cm-hours').value = c?.visitingHours || '5:00 PM - 9:00 PM';
            document.getElementById('cm-slots').value = (c?.slots || ['05:00 PM', '05:30 PM', '06:00 PM', '07:00 PM']).join(', ');

            const selectedDays = new Set(c?.visitingDays || ['Saturday', 'Monday', 'Wednesday']);
            document.querySelectorAll('.cm-day').forEach(cb => { cb.checked = selectedDays.has(cb.value); });

            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        async function persistChambers(nextList, successMsg) {
            try {
                const res = await api.updateMyDoctorProfile({ chambers: nextList });
                chambers = res.doctor?.chambers || nextList;
                renderChambers();
                showAlert(successMsg);
            } catch (err) {
                showAlert(err.message, true);
            }
        }

        (async () => {
            const user = await initDashboardShell('doctor', 'doctor-chambers.html', 'Chambers & Fees', 'Manage hospitals, visiting schedules, and consultation fees');
            if (!user) return;

            const res = await api.getMyDoctorProfile().catch(() => ({ doctor: null }));
            chambers = res.doctor?.chambers || [];
            renderChambers();

            document.getElementById('open-chamber-modal').onclick = () => openModal(-1);
            document.getElementById('close-chamber-modal').onclick = closeModal;
            document.getElementById('cancel-chamber-btn').onclick = closeModal;

            document.getElementById('chamber-form').addEventListener('submit', async (e) => {
                e.preventDefault();
                const idx = Number(document.getElementById('cm-index').value);
                const visitingDays = Array.from(document.querySelectorAll('.cm-day:checked')).map(cb => cb.value);
                if (visitingDays.length === 0) return showAlert('Select at least one visiting day.', true);

                const slots = document.getElementById('cm-slots').value.split(',').map(s => s.trim()).filter(Boolean);
                const item = {
                    hospitalName: document.getElementById('cm-hospital').value.trim(),
                    address: document.getElementById('cm-address').value.trim(),
                    city: document.getElementById('cm-city').value.trim(),
                    district: document.getElementById('cm-district').value.trim(),
                    fee: Number(document.getElementById('cm-fee').value),
                    visitingDays,
                    visitingHours: document.getElementById('cm-hours').value.trim(),
                    slots,
                };

                const nextList = [...chambers];
                if (idx >= 0) nextList[idx] = item;
                else nextList.push(item);

                closeModal();
                await persistChambers(nextList, idx >= 0 ? 'Chamber updated.' : 'Chamber added.');
            });
        })();
    </script>
</body>
</html>
