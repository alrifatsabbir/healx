<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a HealX account to book appointments or join our verified healthcare directory as a doctor.">
    <title>Create an Account | HealX Healthcare Platform</title>
    <link rel="icon" href="./assets/images/icon.png" type="image/png">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8f8f4] text-[#123b39] min-h-screen flex flex-col justify-between antialiased">
    
    <!-- Top bar -->
    <div class="p-6">
        <div class="container w-[min(1180px,calc(100%-48px))] mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <img src="./assets/images/healx-logo-bg-black.png" alt="HealX" width="130" height="35" class="h-10 w-auto object-contain">
            </a>
            <a href="index.html" class="text-xs sm:text-sm font-semibold text-[#082c2a] hover:text-[#0e927f] transition-colors flex items-center gap-1.5">
                ← Back to home
            </a>
        </div>
    </div>

    <!-- Sign Up Container -->
    <main class="flex-1 flex items-center justify-center p-4 sm:p-6 my-4">
        <div class="w-full max-w-[540px] bg-white rounded-3xl p-8 sm:p-10 border border-[#e1eae6] shadow-[0_12px_40px_rgba(8,44,42,0.08)]">
            
            <!-- Role Toggle -->
            <div class="flex bg-[#edf5f1] p-1.5 rounded-2xl mb-8">
                <button type="button" id="role-patient" class="flex-1 py-2 rounded-xl text-xs sm:text-sm font-bold bg-white text-[#082c2a] shadow-sm transition-all cursor-pointer">
                    I am a Patient
                </button>
                <button type="button" id="role-doctor" class="flex-1 py-2 rounded-xl text-xs sm:text-sm font-bold text-[#627a74] hover:text-[#082c2a] transition-all cursor-pointer">
                    I am a Doctor
                </button>
            </div>

            <div class="mb-6">
                <h1 id="signup-title" class="font-extrabold text-2xl sm:text-3xl text-[#082c2a] tracking-tight mb-2">Create Your Account</h1>
                <p id="signup-subtitle" class="text-xs sm:text-sm text-[#6c8680]">Join HealX to book verified appointments with doctors across Bangladesh.</p>
            </div>

            <form id="signup-form" class="space-y-4">
                
                <!-- Common Fields: Name -->
                <div>
                    <label class="block text-xs font-bold text-[#082c2a] mb-1.5">Full Name *</label>
                    <input type="text" required placeholder="e.g. Dr. Sana Rahman or Anik Hossain" class="w-full px-4 py-3 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm text-[#082c2a] focus:bg-white focus:border-[#0e927f] focus:ring-2 focus:ring-[#0e927f]/20 outline-none transition-all">
                </div>

                <!-- Contact Grid: Email & Phone -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-[#082c2a] mb-1.5">Email Address *</label>
                        <input type="email" required placeholder="name@example.com" class="w-full px-4 py-3 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm text-[#082c2a] focus:bg-white focus:border-[#0e927f] focus:ring-2 focus:ring-[#0e927f]/20 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#082c2a] mb-1.5">Phone Number *</label>
                        <input type="tel" required placeholder="017xxxxxxxx" class="w-full px-4 py-3 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm text-[#082c2a] focus:bg-white focus:border-[#0e927f] focus:ring-2 focus:ring-[#0e927f]/20 outline-none transition-all">
                    </div>
                </div>

                <!-- Doctor Specific Fields -->
                <div id="doctor-extra-fields" class="space-y-4 hidden">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-[#082c2a] mb-1.5">BMDC Reg. Number *</label>
                            <input type="text" id="bmdc-input" placeholder="e.g. A-12345" class="w-full px-4 py-3 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm text-[#082c2a] focus:bg-white focus:border-[#0e927f] focus:ring-2 focus:ring-[#0e927f]/20 outline-none transition-all">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-[#082c2a] mb-1.5">Primary Specialty *</label>
                            <select id="specialty-input" class="w-full px-4 py-3 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm text-[#082c2a] focus:bg-white focus:border-[#0e927f] focus:ring-2 focus:ring-[#0e927f]/20 outline-none transition-all cursor-pointer">
                                <option value="Cardiology">Cardiology</option>
                                <option value="Dermatology">Dermatology</option>
                                <option value="Pediatrics">Pediatrics</option>
                                <option value="Neurology">Neurology</option>
                                <option value="Orthopedic">Orthopedics</option>
                                <option value="Gynecology">Gynecology</option>
                                <option value="General Physician">General Medicine</option>
                                <option value="Psychiatry">Psychiatry</option>
                                <option value="Ophthalmology">Ophthalmology</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-[#082c2a] mb-1.5">Current Chamber / Hospital *</label>
                        <input type="text" id="hospital-input" placeholder="e.g. Square Hospital, Dhaka" class="w-full px-4 py-3 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm text-[#082c2a] focus:bg-white focus:border-[#0e927f] focus:ring-2 focus:ring-[#0e927f]/20 outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-[#082c2a] mb-1.5">Profile Picture (Stored on Cloudinary)</label>
                        <input type="file" accept="image/*" class="w-full text-xs text-[#526a64] file:mr-3 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-[#dcefe9] file:text-[#087866] hover:file:bg-[#c2e4da] cursor-pointer">
                        <span class="text-[11px] text-[#738a83] mt-1 block">Supported formats: JPG, PNG, WebP (Max 5MB)</span>
                    </div>
                </div>

                <!-- Password Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-[#082c2a] mb-1.5">Password *</label>
                        <input type="password" required placeholder="Minimum 8 characters" class="w-full px-4 py-3 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm text-[#082c2a] focus:bg-white focus:border-[#0e927f] focus:ring-2 focus:ring-[#0e927f]/20 outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-[#082c2a] mb-1.5">Confirm Password *</label>
                        <input type="password" required placeholder="Repeat password" class="w-full px-4 py-3 rounded-xl border border-[#d7dfdb] bg-[#f8fbf9] text-sm text-[#082c2a] focus:bg-white focus:border-[#0e927f] focus:ring-2 focus:ring-[#0e927f]/20 outline-none transition-all">
                    </div>
                </div>

                <!-- Terms -->
                <div class="flex items-start gap-2.5 pt-1">
                    <input type="checkbox" required id="agree-terms" class="mt-0.5 rounded text-[#0e927f] focus:ring-[#0e927f] cursor-pointer">
                    <label for="agree-terms" class="text-xs text-[#526a64] leading-relaxed cursor-pointer select-none">
                        I agree to the HealX <a href="#" class="text-[#0e927f] font-semibold hover:underline">Terms of Service</a> and <a href="#" class="text-[#0e927f] font-semibold hover:underline">Privacy Policy</a>.
                    </label>
                </div>

                <button type="submit" class="w-full py-3.5 px-6 rounded-full font-bold text-sm bg-[#0e927f] text-white hover:bg-[#087866] transition-all cursor-pointer shadow-md flex items-center justify-center gap-2 mt-4">
                    Create Account <span>↗</span>
                </button>
            </form>

            <div id="signup-feedback" class="mt-4 p-3 rounded-xl text-center text-xs hidden"></div>

            <div class="mt-8 pt-6 border-t border-[#edf2ef] text-center text-xs sm:text-sm text-[#6c8680]">
                Already have an account? 
                <a href="login.html" class="font-bold text-[#0e927f] hover:underline">Log in here</a>
            </div>
        </div>
    </main>

    <!-- Bottom note -->
    <footer class="p-6 text-center text-xs text-[#7d948f]">
        © 2026 HealX Healthcare Platform • Secure medical credentialing
    </footer>

    <script>
        let selectedRole = 'patient';
        const rolePatientBtn = document.getElementById('role-patient');
        const roleDoctorBtn = document.getElementById('role-doctor');
        const signupTitle = document.getElementById('signup-title');
        const signupSubtitle = document.getElementById('signup-subtitle');
        const doctorExtra = document.getElementById('doctor-extra-fields');
        const bmdcInput = document.getElementById('bmdc-input');
        const hospitalInput = document.getElementById('hospital-input');

        rolePatientBtn.addEventListener('click', () => {
            selectedRole = 'patient';
            rolePatientBtn.classList.add('bg-white', 'text-[#082c2a]', 'shadow-sm');
            rolePatientBtn.classList.remove('text-[#627a74]');
            roleDoctorBtn.classList.remove('bg-white', 'text-[#082c2a]', 'shadow-sm');
            roleDoctorBtn.classList.add('text-[#627a74]');
            
            signupTitle.textContent = 'Create Your Patient Account';
            signupSubtitle.textContent = 'Join HealX to book verified appointments with doctors across Bangladesh.';
            doctorExtra.classList.add('hidden');
            bmdcInput.removeAttribute('required');
            hospitalInput.removeAttribute('required');
        });

        roleDoctorBtn.addEventListener('click', () => {
            selectedRole = 'doctor';
            roleDoctorBtn.classList.add('bg-white', 'text-[#082c2a]', 'shadow-sm');
            roleDoctorBtn.classList.remove('text-[#627a74]');
            rolePatientBtn.classList.remove('bg-white', 'text-[#082c2a]', 'shadow-sm');
            rolePatientBtn.classList.add('text-[#627a74]');
            
            signupTitle.textContent = 'Register as Medical Professional';
            signupSubtitle.textContent = 'List your chamber, publish your consultation slots, and reach thousands of patients.';
            doctorExtra.classList.remove('hidden');
            bmdcInput.setAttribute('required', 'true');
            hospitalInput.setAttribute('required', 'true');
        });

        // Submit simulation
        const form = document.getElementById('signup-form');
        const feedback = document.getElementById('signup-feedback');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            feedback.classList.remove('hidden');
            feedback.classList.add('bg-[#eef8f5]', 'text-[#0e927f]');
            feedback.innerHTML = `✓ Successfully registered ${selectedRole} profile! Redirecting to login...`;
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1400);
        });
    </script>
</body>
</html>
